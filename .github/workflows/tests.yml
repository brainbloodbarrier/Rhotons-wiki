name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck first-party shell scripts
        # SC2034: variables kept for backward-compat consumers (documented
        #         in-source); SC2088: intentional literal "~" display strings
        #         in setup.sh output.
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning --exclude=SC2034,SC2088 \
            lib/*.sh .claude/hooks/*.sh setup.sh \
            tests/run-bats.sh tests/bats/test_helper.bash

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats-core and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: run bats suite
        run: tests/run-bats.sh

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install test dependencies
        run: pip install -r tests/python/requirements.txt
      - name: run pytest suite
        run: python -m pytest tests/python -q

  # Non-blocking canary: run the guard against the REAL vaults so drift in
  # live wiki content is visible on every PR without failing the build.
  guard-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: run guard on all registered wikis
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          for wiki in $(jq -r '.wikis | keys[]' .config/wikis.json); do
            echo "::group::guard $wiki"
            lib/autoresearch-guard.sh "$wiki" --format=json || true
            echo "::endgroup::"
          done
